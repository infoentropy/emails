<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Email Block Composer</title>
<style>
:root{
  --ground:#f6f8fa; --surface:#ffffff; --surface-2:#eef2f6;
  --ink:#152029; --muted:#5b6b7b; --line:#dbe3ea; --line-strong:#c3cfda;
  --accent:#0b6b5e; --accent-soft:#e0f0ec; --warn:#8a5200; --warn-soft:#fbf0dd;
  --radius:10px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0e141a; --surface:#161d25; --surface-2:#1d262f;
  --ink:#e4ebf2; --muted:#93a3b3; --line:#27313c; --line-strong:#38454f;
  --accent:#54cfba; --accent-soft:#12302c; --warn:#e3a85c; --warn-soft:#2e2312;
}}
:root[data-theme="dark"]{
  --ground:#0e141a; --surface:#161d25; --surface-2:#1d262f;
  --ink:#e4ebf2; --muted:#93a3b3; --line:#27313c; --line-strong:#38454f;
  --accent:#54cfba; --accent-soft:#12302c; --warn:#e3a85c; --warn-soft:#2e2312;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
     border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:baseline;gap:9px}
.brand small{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-strong);
       border-radius:7px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.primary:hover{color:#fff;filter:brightness(1.08)}

.wrap{max-width:1200px;margin:0 auto;padding-block:22px 64px;padding-left:20px;padding-right:20px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:26px;align-items:start}
@media (max-width:900px){ .grid{grid-template-columns:minmax(0,1fr)} }

h2{font:600 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.meta{border-left:3px solid var(--accent);padding-left:16px;margin-bottom:26px}
.meta .row{display:grid;gap:4px;margin-bottom:12px}
label{font:550 11px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px}
textarea{resize:vertical;min-height:70px}
.help{font-size:12.5px;color:var(--muted)}
.err{font-size:12.5px;color:var(--warn);font-weight:550}

.stack{display:flex;flex-direction:column;gap:14px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.block.bad{border-color:var(--warn)}
.bhead{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--surface-2);
       border-bottom:1px solid var(--line)}
.chip{font:600 11px/1 var(--mono);letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);
      border-radius:5px;padding:5px 7px}
.bid{font:500 11px/1 var(--mono);color:var(--muted)}
.bhead .sp{margin-left:auto;display:flex;gap:5px}
.icon{padding:4px 8px;font:500 13px/1.3 var(--mono);min-width:30px}
.fields{padding:14px 12px;display:grid;gap:13px}
.f{display:grid;gap:4px}

.bhead{flex-wrap:wrap}
.txt{padding:4px 9px;font-size:12.5px}
.tag{font:500 11px/1 var(--mono);color:var(--muted);border:1px dashed var(--line-strong);border-radius:5px;padding:4px 6px}
.block.is-hidden .fields,.block.is-hidden .unknown,.block.is-hidden .summary{opacity:.45}
.rulerow{padding:12px 12px 0;display:grid;gap:4px}
.ruleline{display:flex;gap:8px;flex-wrap:wrap}
.ruleline input{flex:1 1 220px;min-width:0}
.rule{flex:1 1 200px;min-width:0;padding:5px 8px;font-size:14px}
.rerr{padding:6px 12px 0}
.summary{padding:10px 12px;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;max-width:100%}

.group{border:1px solid var(--line-strong);border-left:3px solid var(--accent);border-radius:var(--radius);
       background:var(--surface-2);padding:10px;display:flex;flex-direction:column;gap:10px}
.group.bad{border-color:var(--warn);border-left-color:var(--warn)}
.ghead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ghead .sp{margin-left:auto;display:flex;gap:5px}
.case-label{font:650 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:7px;padding:8px 10px;font-size:13px;
        display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nofallback{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:10px 12px;font-size:13.5px;
            color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.unknown{padding:14px 12px;font-size:13.5px;color:var(--muted);background:var(--warn-soft)}
.unknown code{font-family:var(--mono);color:var(--ink)}

.palette{margin-top:24px;border-top:1px dashed var(--line-strong);padding-top:16px}
.pal-btns{display:flex;flex-wrap:wrap;gap:8px}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel h2{padding:12px 14px 0;margin-bottom:8px}
pre{margin:0;padding:0 14px 14px;font:12.5px/1.55 var(--mono);white-space:pre;overflow-x:auto;max-height:52vh;overflow-y:auto}
.issues{padding:0 14px 14px;display:flex;flex-direction:column;gap:7px;font-size:13px;max-height:24vh;overflow-y:auto}
.issue{color:var(--warn)}
.issue b{font-family:var(--mono);font-size:12px;font-weight:600}
.ok{padding:0 14px 14px;font-size:13px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);padding:0 14px 14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar"><div class="bar-in">
  <div class="brand">Email Block Composer <small id="saved">·</small></div>
  <button id="save" class="primary">Save as&hellip;</button>
  <button id="copy">Copy JSON</button>
  <button id="paste">Paste JSON</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
  <button id="open">Open file</button>
  <button id="blank">New</button>
</div></div>

<div class="wrap"><div class="grid">
  <div>
    <h2>Campaign</h2>
    <div class="meta" id="meta"></div>
    <h2>Blocks</h2>
    <div class="stack" id="stack"></div>
    <div class="palette">
      <h2>Add a block</h2>
      <div class="pal-btns" id="pal"></div>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>Validation</h2>
      <div id="issues"></div>
    </div>
    <div class="panel">
      <h2>Document</h2>
      <pre id="json"></pre>
      <div class="note">This is the output. There is no HTML preview — rendering belongs to the render layer.</div>
    </div>
  </div>
</div></div>

<script>
"use strict";
const SCHEMAS = {
  "article": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "$id": "block:article",
    "title": "Article",
    "version": 1,
    "type": "object",
    "properties": {
      "headline": {
        "title": "Headline",
        "type": "string",
        "fieldType": "text",
        "weight": 1
      },
      "link": {
        "title": "Article link",
        "type": "string",
        "fieldType": "text",
        "weight": 2,
        "format": "uri"
      },
      "image": {
        "title": "Image URL",
        "type": "string",
        "fieldType": "text",
        "weight": 3,
        "format": "uri"
      },
      "image_alt": {
        "title": "Image alt text",
        "type": "string",
        "fieldType": "text",
        "weight": 4,
        "description": "Describes the image for recipients whose client blocks images, which is most on first open."
      },
      "image_width": {
        "title": "Image width (px)",
        "type": "integer",
        "fieldType": "integer",
        "weight": 5
      },
      "image_height": {
        "title": "Image height (px)",
        "type": "integer",
        "fieldType": "integer",
        "weight": 6
      },
      "variant": {
        "title": "Variant",
        "type": "string",
        "fieldType": "text",
        "weight": 7,
        "enum": [
          "primary",
          "secondary"
        ],
        "default": "secondary",
        "description": "primary is the lead feature, secondary a regular item. Defaults to secondary: a newspaper has one lead and many regulars."
      }
    },
    "required": [
      "headline",
      "link",
      "image",
      "image_alt",
      "image_width",
      "image_height"
    ]
  },
  "button": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "$id": "block:button",
    "title": "Button",
    "version": 1,
    "type": "object",
    "properties": {
      "text": {
        "title": "Label",
        "type": "string",
        "fieldType": "text",
        "weight": 1
      },
      "link": {
        "title": "Link",
        "type": "string",
        "fieldType": "text",
        "weight": 2,
        "format": "uri"
      },
      "variant": {
        "title": "Variant",
        "type": "string",
        "fieldType": "text",
        "weight": 3,
        "enum": [
          "primary",
          "secondary"
        ],
        "default": "primary",
        "description": "Emphasis, resolved to an appearance by the theme. Shared vocabulary; see the authoring tool spec."
      }
    },
    "required": [
      "text",
      "link"
    ]
  },
  "content_feature_header": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "$id": "block:content_feature_header",
    "title": "Content Feature Header",
    "version": 1,
    "type": "object",
    "properties": {
      "heading": {
        "title": "Heading",
        "type": "string",
        "fieldType": "text",
        "weight": 1
      },
      "feature_type": {
        "title": "Feature type",
        "type": "string",
        "fieldType": "text",
        "weight": 2,
        "description": "Which product area this feature belongs to. The theme selects imagery from it. Values are drawn only from evidence in content/weekly.json: 'sleep' appears as a feature_type and in the feature link, 'meditate' as the destination of both buttons. Widening this enum is a permitted schema change, so add values as real campaigns need them.",
        "enum": [
          "meditate",
          "sleep"
        ]
      }
    },
    "required": [
      "heading",
      "feature_type"
    ]
  },
  "divider": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "$id": "block:divider",
    "title": "Divider",
    "version": 1,
    "type": "object",
    "properties": {
      "variant": {
        "title": "Variant",
        "type": "string",
        "fieldType": "text",
        "weight": 1,
        "enum": [
          "primary",
          "secondary"
        ],
        "default": "primary",
        "description": "Emphasis, resolved to an appearance by the theme. Shared vocabulary; see the authoring tool spec."
      }
    }
  },
  "image_with_text": {
    "$schema": "https://json-schema.org/draft/2020-12/schema",
    "$id": "block:image_with_text",
    "title": "Image with Text",
    "version": 1,
    "type": "object",
    "properties": {
      "heading": {
        "title": "Heading",
        "type": "string",
        "fieldType": "text",
        "weight": 1
      },
      "body": {
        "title": "Body",
        "type": "string",
        "fieldType": "markdown",
        "weight": 2,
        "default": "",
        "description": "Authored in markdown. Raw HTML is escaped, not rendered."
      },
      "image": {
        "title": "Image URL",
        "type": "string",
        "fieldType": "text",
        "weight": 3,
        "format": "uri"
      },
      "image_alt": {
        "title": "Image alt text",
        "type": "string",
        "fieldType": "text",
        "weight": 4,
        "description": "Describes the image for recipients whose client blocks images, which is most on first open."
      },
      "image_width": {
        "title": "Image width (px)",
        "type": "integer",
        "fieldType": "integer",
        "weight": 5
      },
      "image_height": {
        "title": "Image height (px)",
        "type": "integer",
        "fieldType": "integer",
        "weight": 6
      }
    },
    "required": [
      "heading",
      "image",
      "image_alt",
      "image_width",
      "image_height"
    ]
  }
};
const KEY = "email-block-composer/doc";

const sorted = s => Object.entries(s.properties).sort((a,b) => a[1].weight - b[1].weight);

const SAMPLE = {
  version:1,
  name:"Sleep Stories — weekly (sample)",
  subject:"Three new Sleep Stories for this week",
  preheader:"Narrated by voices you'll actually drift off to",
  blocks:[
    {id:"b1",blockType:"content_feature_header",data:{heading:"New This Week",feature_type:"sleep"}},
    {id:"b2",blockType:"article",data:{headline:"A Slow Train Through the Alps",
      link:"https://www.calm.com/sleep/slow-train",image:"https://assets.example.com/sleep/alps.jpg",
      image_alt:"Night train winding along a moonlit mountain pass",image_width:1200,image_height:630,variant:"primary"}},
    {id:"b3",blockType:"divider",data:{variant:"secondary"}},
    {id:"b4",blockType:"article",data:{headline:"The Lighthouse Keeper's Year",
      link:"https://www.calm.com/sleep/lighthouse",image:"https://assets.example.com/sleep/lighthouse.jpg",
      image_alt:"A lighthouse beam sweeping over calm water at dusk",image_width:600,image_height:400,variant:"secondary"}},
    {id:"b5",blockType:"image_with_text",data:{heading:"Why we record at 60 bpm",
      body:"Every story is narrated just below resting heart rate.\n\nIt is slower than feels natural to read aloud — which is the point.",
      image:"https://assets.example.com/sleep/studio.jpg",image_alt:"A recording booth lit by a single warm lamp",
      image_width:800,image_height:500}},
    {id:"b6",blockType:"button",switch:"s1",ruleset:"users in US, CA, GB. not a paying subscriber",
      data:{text:"Start your free trial",link:"https://www.calm.com/trial",variant:"primary"}},
    {id:"b7",blockType:"button",switch:"s1",
      data:{text:"Open tonight's story",link:"https://www.calm.com/sleep",variant:"primary"}}
  ]
};

const blank = () => ({version:1,name:"",subject:"",preheader:"",blocks:[]});

let doc;
try { const raw = localStorage.getItem(KEY); doc = raw ? JSON.parse(raw) : structuredClone(SAMPLE); }
catch(e){ doc = structuredClone(SAMPLE); }
if(!doc || !Array.isArray(doc.blocks)) doc = structuredClone(SAMPLE);

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(doc)); flash("saved"); }
  catch(e){ flash("not saved"); }
}
let flashT;
function flash(word){
  const el = document.getElementById("saved");
  el.textContent = "· " + word;
  clearTimeout(flashT);
  flashT = setTimeout(()=>{ el.textContent = "·"; }, 1400);
}

function nextId(){
  let max = 0;
  for(const b of doc.blocks){
    const m = /^b(\d+)$/.exec(String(b.id||""));
    if(m) max = Math.max(max, +m[1]);
  }
  return "b" + (max + 1);
}

// ---- visibility: hidden, ruleset, switch groups ----
// A switch group is a run of adjacent blocks sharing a `switch` value. Cases are checked in order and
// the first match wins; the last case with no `ruleset` key at all is the fallback ("Otherwise").
// A case whose ruleset is present but blank is still being written: it gets a field, not the fallback slot.
const sw = b => (typeof b.switch === "string" && b.switch !== "") ? b.switch : "";
const hasRule = b => typeof b.ruleset === "string" && b.ruleset.trim() !== "";
const noRuleKey = b => b.ruleset === undefined || b.ruleset === null;

function nextSwitch(){
  let max = 0;
  for(const b of doc.blocks){
    const m = /^s(\d+)$/.exec(sw(b));
    if(m) max = Math.max(max, +m[1]);
  }
  return "s" + (max + 1);
}

function cloneBlock(b, extra){
  return Object.assign({id:nextId(), blockType:b.blockType, data:JSON.parse(JSON.stringify(b.data ?? {}))}, extra);
}

// The stack as the author sees it: plain blocks and switch groups, in order.
function units(){
  const out = [];
  doc.blocks.forEach((b,i) => {
    const name = sw(b), last = out[out.length-1];
    if(name && last && last.kind === "group" && last.name === name) last.end = i;
    else out.push(name ? {kind:"group", name, start:i, end:i} : {kind:"block", start:i, end:i});
  });
  const runs = {};
  for(const u of out) if(u.kind === "group") runs[u.name] = (runs[u.name] || 0) + 1;
  for(const u of out) if(u.kind === "group") u.split = runs[u.name] > 1;
  return out;
}

const hasFallback = u => noRuleKey(doc.blocks[u.end]);

// Swap unit k with its neighbour, moving whole groups at once.
function moveUnit(us, k, dir){
  const a = dir < 0 ? us[k-1] : us[k], b = dir < 0 ? us[k] : us[k+1];
  const A = doc.blocks.slice(a.start, a.end+1), B = doc.blocks.slice(b.start, b.end+1);
  doc.blocks.splice(a.start, A.length + B.length, ...B, ...A);
}

function swapBlocks(i, j){ const t = doc.blocks[i]; doc.blocks[i] = doc.blocks[j]; doc.blocks[j] = t; }

function regroup(name){
  const first = doc.blocks.findIndex(b => sw(b) === name);
  const members = doc.blocks.filter(b => sw(b) === name);
  const rest = doc.blocks.filter(b => sw(b) !== name);
  rest.splice(first, 0, ...members);
  doc.blocks = rest;
}

// Structural problems: [id, field or null, message].
function structureIssues(){
  const out = [], reported = new Set();
  for(const u of units()){
    if(u.kind !== "group") continue;
    if(u.split && !reported.has(u.name)){
      reported.add(u.name);
      out.push(["switch " + u.name, null, "This switch is split up. Its cases must sit together — use Regroup."]);
    }
    for(let i = u.start; i < u.end; i++){
      const b = doc.blocks[i];
      if(!b.hidden && !hasRule(b))
        out.push([b.id, "ruleset", "Empty ruleset: this case matches everyone, so the cases below it never show."]);
    }
  }
  return out;
}

function defaultsFor(type){
  const s = SCHEMAS[type], d = {};
  if(!s) return d;
  for(const [k,f] of sorted(s)) d[k] = ("default" in f) ? f.default : "";
  return d;
}

// ---- validation: required / type / enum / format(uri,date). Advisory only. ----
function issuesFor(block){
  const s = SCHEMAS[block.blockType];
  if(!s) return [];
  const req = new Set(s.required || []), out = [];
  for(const [k,f] of sorted(s)){
    const v = block.data[k];
    const empty = v === undefined || v === null || String(v).trim() === "";
    if(req.has(k)){
      if(empty){ out.push([k, f.title + " is required."]); continue; }
    } else if(empty) continue;          // not filled in: skip every other check
    const str = String(v).trim();
    if(f.type === "integer" && !/^-?\d+$/.test(str)) out.push([k, "Must be a whole number."]);
    else if(f.type === "number" && isNaN(Number(str))) out.push([k, "Must be a number."]);
    if(f.enum && !f.enum.includes(v)) out.push([k, "Must be one of: " + f.enum.join(", ") + "."]);
    if(f.format === "uri" && !/^https?:\/\/\S+$/i.test(str)) out.push([k, "Must start with http:// or https://"]);
    if(f.format === "date" && !/^\d{4}-\d{2}-\d{2}$/.test(str)) out.push([k, "Must be a date, as YYYY-MM-DD."]);
  }
  return out;
}

// ---- serialise: weight order, numbers as numbers, unknown blocks untouched ----
function serialise(){
  const out = {version:doc.version||1, name:doc.name||"", subject:doc.subject||"",
               preheader:doc.preheader||"", blocks:[]};
  for(const b of doc.blocks){
    const s = SCHEMAS[b.blockType];
    let data;
    if(!s){ data = JSON.parse(JSON.stringify(b.data ?? {})); }
    else {
      data = {};
      for(const [k,f] of sorted(s)){
        let v = b.data[k];
        if(v === undefined) continue;
        if((f.type === "integer" || f.type === "number") && String(v).trim() !== "" && !isNaN(Number(v))) v = Number(v);
        data[k] = v;
      }
    }
    const o = {id:b.id, blockType:b.blockType};
    if(sw(b)) o.switch = b.switch;
    if(hasRule(b)) o.ruleset = b.ruleset.trim();
    if(b.hidden === true) o.hidden = true;
    for(const [k,v] of Object.entries(b))            // block-level keys this tool doesn't know: keep them
      if(!["id","blockType","switch","ruleset","hidden","data"].includes(k)) o[k] = JSON.parse(JSON.stringify(v));
    o.data = data;
    out.blocks.push(o);
  }
  return out;
}

const el = (tag, cls, text) => { const n = document.createElement(tag);
  if(cls) n.className = cls; if(text !== undefined) n.textContent = text; return n; };

function control(name, f, block){
  let n;
  if(f.fieldType === "paragraph" || f.fieldType === "markdown"){
    n = el("textarea"); n.rows = f.fieldType === "markdown" ? 5 : 3;
  } else {
    n = el("input");
    n.type = f.fieldType === "date" ? "date" : (f.fieldType === "integer" || f.fieldType === "float") ? "number" : "text";
    if(f.fieldType === "integer") n.step = "1";
    if(f.fieldType === "float") n.step = "any";
  }
  n.id = "f-" + block.id + "-" + name;
  n.value = block.data[name] ?? "";
  n.addEventListener("input", () => {
    block.data[name] = n.value;
    save(); refreshLive();
  });
  return n;
}

function renderMeta(){
  const host = document.getElementById("meta");
  host.textContent = "";
  for(const [key,label,hint] of [
    ["name","Campaign name","Internal only — recipients never see this."],
    ["subject","Subject line",""],
    ["preheader","Preheader","Preview text after the subject in the inbox."]
  ]){
    const row = el("div","row");
    const lab = el("label", null, label); lab.htmlFor = "m-" + key;
    const inp = el("input"); inp.id = "m-" + key; inp.value = doc[key] ?? "";
    inp.addEventListener("input", () => { doc[key] = inp.value; save(); refreshLive(); });
    row.append(lab, inp);
    if(hint) row.append(el("div","help",hint));
    host.append(row);
  }
}

const collapsed = new Set();   // case ids folded to a summary line; view state only, never saved
let focusAfter = null;

function mk(label, title, fn, disabled, cls){
  const btn = el("button", cls || "icon", label);
  btn.title = title; btn.setAttribute("aria-label", title); btn.disabled = !!disabled;
  if(disabled) btn.style.opacity = ".35";
  btn.addEventListener("click", fn);
  return btn;
}

const typeTitle = b => SCHEMAS[b.blockType] ? SCHEMAS[b.blockType].title : b.blockType;

function hideBtn(b){
  return mk(b.hidden ? "Show" : "Hide",
            b.hidden ? "Include this block again" : "Hide this block (kept in the document, never sent)",
            () => { if(b.hidden) delete b.hidden; else b.hidden = true; commit(); }, false, "txt");
}

function ruleInput(b, placeholder, cls){
  const n = el("input", cls);
  n.id = "r-" + b.id; n.value = b.ruleset ?? ""; n.placeholder = placeholder;
  n.setAttribute("aria-label", "Who sees this");
  n.addEventListener("input", () => { b.ruleset = n.value; save(); refreshLive(); });
  return n;
}

function fieldsFor(b){
  const s = SCHEMAS[b.blockType];
  if(!s){
    const u = el("div","unknown");
    u.append(document.createTextNode("Unknown block type "));
    u.append(el("code",null,b.blockType));
    u.append(document.createTextNode(". Its fields can't be edited here, but they are kept exactly as they were and written back out on export."));
    return u;
  }
  const fields = el("div","fields");
  for(const [name,f] of sorted(s)){
    const wrap = el("div","f");
    const lab = el("label", null, f.title + ((s.required||[]).includes(name) ? " *" : ""));
    const inp = control(name, f, b);
    lab.htmlFor = inp.id;
    wrap.append(lab, inp);
    if(f.enum) wrap.append(el("div","help","One of: " + f.enum.join(", ")));
    else if(f.description) wrap.append(el("div","help", f.description));
    const e = el("div","err"); e.id = "e-" + b.id + "-" + name; e.hidden = true;
    wrap.append(e);
    fields.append(wrap);
  }
  return fields;
}

function summaryOf(b){
  const s = SCHEMAS[b.blockType];
  if(s) for(const [k] of sorted(s)){
    const v = b.data[k];
    if(typeof v === "string" && v.trim()) return v.trim();
  }
  return "(empty)";
}

function blockCard(b, {lead = [], actions, below = [], collapsible = false}){
  const card = el("div","block");
  card.dataset.bid = b.id;
  if(b.hidden) card.classList.add("is-hidden");
  const head = el("div","bhead");
  head.append(...lead, el("span","chip", typeTitle(b)), el("span","bid", b.id));
  if(b.hidden) head.append(el("span","tag","hidden · not sent"));
  const sp = el("div","sp"); sp.append(...actions); head.append(sp);
  card.append(head, ...below);
  if(collapsible && collapsed.has(b.id)) card.append(el("div","summary", summaryOf(b)));
  else card.append(fieldsFor(b));
  return card;
}

function plainCard(us, k){
  const i = us[k].start, b = doc.blocks[i];
  const row = el("div","rulerow");
  const lab = el("label", null, "Who sees this block");
  const inp = ruleInput(b, "Everyone. Or describe who: users in US, CA. paying subscribers");
  lab.htmlFor = inp.id;
  const ver = mk("Add a version…", "Show a different version of this block to some recipients",
                 () => addVersion(i), false, "txt");
  const line = el("div","ruleline"); line.append(inp, ver);
  row.append(lab, line);
  return blockCard(b, {
    below:[row],
    actions:[
      mk("↑","Move up",   () => { moveUnit(us,k,-1); commit(); }, k === 0),
      mk("↓","Move down", () => { moveUnit(us,k, 1); commit(); }, k === us.length-1),
      hideBtn(b),
      mk("⧉","Duplicate", () => {
        const c = cloneBlock(b);
        if(hasRule(b)) c.ruleset = b.ruleset;
        if(b.hidden) c.hidden = true;
        doc.blocks.splice(i+1, 0, c); commit(); }),
      mk("✕","Delete",    () => { if(confirm("Delete this " + typeTitle(b) + " block?")){ doc.blocks.splice(i,1); commit(); } })
    ]
  });
}

function addVersion(i){
  const b = doc.blocks[i];
  if(!hasRule(b)) delete b.ruleset;               // no rule: the original becomes the fallback
  b.switch = nextSwitch();
  const c = cloneBlock(b, {switch:b.switch, ruleset:""});
  doc.blocks.splice(i, 0, c);
  focusAfter = "r-" + c.id;
  commit();
}

function addCase(u, type){
  const c = type ? {id:nextId(), blockType:type, data:defaultsFor(type)} : cloneBlock(doc.blocks[u.end]);
  c.switch = u.name; c.ruleset = "";
  doc.blocks.splice(hasFallback(u) ? u.end : u.end + 1, 0, c);
  focusAfter = "r-" + c.id;
  commit();
}

function addFallback(u){
  const c = cloneBlock(doc.blocks[u.end], {switch:u.name});
  doc.blocks.splice(u.end + 1, 0, c);
  commit();
}

function deleteCase(u, i, isFallback){
  if(!confirm(isFallback ? "Remove the fallback? Recipients no case matches will see nothing here."
                         : "Delete this case?")) return;
  doc.blocks.splice(i, 1);
  const left = doc.blocks.filter(x => sw(x) === u.name);
  if(left.length === 1) delete left[0].switch;    // one case left: it's a plain block again
  commit();
}

function groupCard(us, k){
  const u = us[k], n = u.end - u.start + 1, fb = hasFallback(u);
  const g = el("div","group");
  g.dataset.sw = u.name;
  if(u.split) g.classList.add("bad");

  const head = el("div","ghead");
  head.append(el("span","chip","Switch"), el("span","help","Checked top to bottom, first match wins"));
  const sp = el("div","sp");
  sp.append(
    mk("↑","Move switch up",   () => { moveUnit(us,k,-1); commit(); }, k === 0),
    mk("↓","Move switch down", () => { moveUnit(us,k, 1); commit(); }, k === us.length-1),
    mk("✕","Delete switch",    () => { if(confirm("Delete this switch and its " + n + " case" + (n === 1 ? "" : "s") + "?")){
                                         doc.blocks.splice(u.start, n); commit(); } })
  );
  head.append(sp);
  g.append(head);

  if(u.split){
    const ban = el("div","banner");
    ban.append(el("span",null,"This switch is split: more of its cases sit elsewhere in the email. A switch renders in one place, so its cases must be together."),
               mk("Regroup","Move all of this switch's cases together", () => { regroup(u.name); commit(); }, false, "txt"));
    g.append(ban);
  }

  for(let i = u.start; i <= u.end; i++){
    const b = doc.blocks[i], isFb = fb && i === u.end;
    const folded = collapsed.has(b.id);
    const lead = [
      mk(folded ? "▸" : "▾", folded ? "Expand" : "Collapse", () => {
        if(folded) collapsed.delete(b.id); else collapsed.add(b.id); render(); }),
      el("span","case-label", isFb ? "Otherwise" : i === u.start ? "If" : "Else if")
    ];
    if(isFb) lead.push(el("span","help","everyone else"));
    else lead.push(ruleInput(b, "Who sees this version? e.g. users in US", "rule"));
    const lastMovable = fb ? u.end - 1 : u.end;
    const actions = [];
    if(!isFb) actions.push(
      mk("↑","Move case up",   () => { swapBlocks(i, i-1); commit(); }, i === u.start),
      mk("↓","Move case down", () => { swapBlocks(i, i+1); commit(); }, i >= lastMovable));
    actions.push(hideBtn(b), mk("✕", isFb ? "Remove fallback" : "Delete case", () => deleteCase(u, i, isFb)));
    const below = [];
    if(!isFb){ const e = el("div","err rerr"); e.id = "e-" + b.id + "-ruleset"; e.hidden = true; below.push(e); }
    g.append(blockCard(b, {lead, actions, below, collapsible:true}));
  }

  if(!fb){
    const nf = el("div","nofallback");
    nf.append(el("span",null,"No fallback: everyone else sees nothing here."),
              mk("Add fallback","Add an Otherwise case for everyone no case matches", () => addFallback(u), false, "txt"));
    g.append(nf);
  }

  const foot = el("div","gfoot");
  foot.append(mk("+ Add case", "Adds a copy of " + (fb ? "Otherwise" : "the last case"), () => addCase(u, null), false, "txt"));
  const sel = el("select");
  sel.setAttribute("aria-label","Add a case of another block type");
  sel.append(new Option("+ Add case of another type…", ""));
  for(const [type,s] of Object.entries(SCHEMAS)) sel.append(new Option(s.title, type));
  sel.addEventListener("change", () => { if(sel.value) addCase(u, sel.value); });
  foot.append(sel);
  g.append(foot);
  return g;
}

function renderBlocks(){
  const host = document.getElementById("stack");
  host.textContent = "";
  if(!doc.blocks.length){
    host.append(el("div","help","No blocks yet. Add one below."));
    return;
  }
  const us = units();
  us.forEach((u,k) => host.append(u.kind === "group" ? groupCard(us, k) : plainCard(us, k)));
}

function renderPalette(){
  const host = document.getElementById("pal");
  host.textContent = "";
  for(const [type,s] of Object.entries(SCHEMAS)){
    const b = el("button", null, s.title);
    b.addEventListener("click", () => {
      doc.blocks.push({id:nextId(), blockType:type, data:defaultsFor(type)});
      commit();
    });
    host.append(b);
  }
}

function refreshLive(){
  document.getElementById("json").textContent = JSON.stringify(serialise(), null, 2);
  const box = document.getElementById("issues");
  box.textContent = "";
  const list = el("div","issues");
  const row = (label, msg) => {
    const r = el("div","issue");
    r.append(el("b",null,label + " "), document.createTextNode(msg));
    list.append(r);
  };
  let n = 0;
  for(const b of doc.blocks){
    const found = b.hidden ? [] : issuesFor(b);   // hidden blocks are never sent, so they aren't checked
    const s = SCHEMAS[b.blockType];
    if(s) for(const [k] of sorted(s)){
      const e = document.getElementById("e-" + b.id + "-" + k);
      const hit = found.find(f => f[0] === k);
      if(e){ e.hidden = !hit; e.textContent = hit ? hit[1] : ""; }
    }
    for(const [k,msg] of found){ n++; row(b.id + "." + k, msg); }
    const card = document.querySelector('.block[data-bid="' + CSS.escape(String(b.id)) + '"]');
    if(card) card.classList.toggle("bad", found.length > 0);
  }
  for(const e of document.querySelectorAll(".rerr")){ e.hidden = true; e.textContent = ""; }
  for(const [id,k,msg] of structureIssues()){
    n++;
    row(k ? id + "." + k : id, msg);
    const e = k && document.getElementById("e-" + id + "-" + k);
    if(e){ e.hidden = false; e.textContent = msg; }
  }
  if(n) box.append(list);
  else box.append(el("div","ok","Everything checks out. Validation never blocks export — a half-finished email still saves."));
}

function commit(){ save(); render(); }
function render(){
  renderMeta(); renderBlocks(); renderPalette(); refreshLive();
  if(focusAfter){ const n = document.getElementById(focusAfter); focusAfter = null; if(n) n.focus(); }
}

function filename(){
  const base = String(doc.name || doc.subject || "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  return (base || "email-document") + ".json";
}

async function saveAs(){
  const text = JSON.stringify(serialise(), null, 2);
  const name = filename();
  if(window.showSaveFilePicker){
    try {
      const handle = await showSaveFilePicker({ suggestedName:name,
        types:[{description:"Email document", accept:{"application/json":[".json"]}}] });
      const w = await handle.createWritable();
      await w.write(text);
      await w.close();
      flash("saved to disk");
      return;
    } catch(e){
      if(e && e.name === "AbortError") return;      // the author closed the dialog
      // no picker permission here (file:// among others) — fall through and download
    }
  }
  const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  flash("downloaded");
}
document.getElementById("save").addEventListener("click", saveAs);

document.getElementById("copy").addEventListener("click", async () => {
  const text = JSON.stringify(serialise(), null, 2);
  try { await navigator.clipboard.writeText(text); flash("copied"); }
  catch(e){ flash("press ⌘C"); const p = document.getElementById("json");
            const r = document.createRange(); r.selectNodeContents(p);
            const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
});
document.getElementById("paste").addEventListener("click", () => {
  const text = prompt("Paste an email document (JSON). This replaces what's open.");
  if(text) load(text);
});
document.getElementById("open").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", ev => {
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => load(r.result);
  r.readAsText(f);
  ev.target.value = "";
});
document.getElementById("blank").addEventListener("click", () => {
  if(confirm("Start an empty email? What's open now will be discarded.")){ doc = blank(); commit(); }
});

function load(text){
  let next;
  try { next = JSON.parse(text); }
  catch(e){ alert("That isn't valid JSON, so nothing was changed."); return; }
  if(!next || !Array.isArray(next.blocks)){ alert("That JSON has no blocks array, so it isn't an email document."); return; }
  if(!confirm("Replace what's open with this document?")) return;
  next.blocks = next.blocks.map((b,i) => {
    b = (b && typeof b === "object") ? b : {};
    return Object.assign({}, b, {id:b.id || ("b"+(i+1)), blockType:b.blockType, data:b.data ?? {}});
  });
  doc = {version:next.version||1, name:next.name||"", subject:next.subject||"",
         preheader:next.preheader||"", blocks:next.blocks};
  commit();
}

render();
</script>
</body>
